name: Inventory application build

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventory-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/frontend/package-lock.json
      - name: Restore locked backend dependencies
        run: dotnet restore AI-Smart-Inventory.slnx --locked-mode
      - name: Build API and MCP server
        run: dotnet build AI-Smart-Inventory.slnx --no-restore --disable-build-servers
      - name: Install locked frontend dependencies
        run: npm ci
        working-directory: frontend/frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend/frontend
